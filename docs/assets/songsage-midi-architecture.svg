<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw MusicLab: eigener Architekturentwurf</title>
  <desc id="desc">Projektbrief zu Textplaner, Musikmodell, Validator und MIDI-Export. Optional folgt separat freigegebenes Audio-Rendering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#365b63"/>
    </marker>
  </defs>
  <rect width="1000" height="340" rx="18" fill="#f4f1e8"/>
  <g font-family="Georgia, serif" fill="#19383f">
    <text x="30" y="43" font-size="25">OpenClaw MusicLab</text>
    <text x="30" y="73" font-size="15">Eigener Forschungsentwurf, kein SongSage-Nachbau oder Runtime-Nachweis</text>
  </g>
  <g fill="#ffffff" stroke="#365b63" stroke-width="2">
    <rect x="30" y="110" width="164" height="85" rx="10"/>
    <rect x="224" y="110" width="164" height="85" rx="10"/>
    <rect x="418" y="110" width="164" height="85" rx="10"/>
    <rect x="612" y="110" width="164" height="85" rx="10"/>
    <rect x="806" y="110" width="164" height="85" rx="10"/>
    <rect x="612" y="245" width="358" height="65" rx="10" fill="#e4ede3"/>
  </g>
  <g stroke="#365b63" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M194 152 H218"/><path d="M388 152 H412"/>
    <path d="M582 152 H606"/><path d="M776 152 H800"/>
    <path d="M888 195 V239" stroke-dasharray="6 4"/>
  </g>
  <g font-family="Verdana, sans-serif" text-anchor="middle" fill="#19383f" font-size="16">
    <text x="112" y="144">Projektbrief</text><text x="112" y="172" font-size="12">Stil, Tempo, Rechte</text>
    <text x="306" y="144">Textplaner</text><text x="306" y="172" font-size="12">Form und eigene Lyrics</text>
    <text x="500" y="144">Musikmodell</text><text x="500" y="172" font-size="12">Symbolische Ereignisse</text>
    <text x="694" y="144">Validator</text><text x="694" y="172" font-size="12">Zeit, Noten, Grenzen</text>
    <text x="888" y="144">MIDI-Export</text><text x="888" y="172" font-size="12">Editierbare DAW-Datei</text>
    <text x="791" y="271">Optional: Audio-Rendering</text>
    <text x="791" y="296" font-size="12">Synthesizer und Soundbank separat freigeben</text>
  </g>
  <text x="30" y="270" font-family="Verdana, sans-serif" font-size="13" fill="#365b63">Alle Komponenten: geplant, nicht installiert.</text>
  <text x="30" y="296" font-family="Verdana, sans-serif" font-size="13" fill="#365b63">Training, Gesang und Video sind eigene Schritte.</text>
</svg>
