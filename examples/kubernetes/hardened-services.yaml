# Hardened, inactive examples. Read README.md before creating any workload.
# Original examples remain unchanged in docs/legacy/K8S_DEPLOYMENTS_LEGACY.md.
# Images below are deliberately non-routable placeholders, not verified image pins.
# A private overlay must set reviewed image digests, configuration and replicas.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-services
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-services
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: ollama
        image: registry.invalid/openclaw-reviewed/ollama:operator-must-pin
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        env:
        - {name: HOME, value: /var/lib/ollama}
        - {name: OLLAMA_MODELS, value: /var/lib/ollama/models}
        ports:
        - containerPort: 11434
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: ollama-models
          mountPath: /var/lib/ollama
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-pvc
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: ai-services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---

