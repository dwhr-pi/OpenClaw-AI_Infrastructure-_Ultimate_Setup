apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmanus
  namespace: ai-services
  labels:
    app: openmanus
spec:
  replicas: 0
  selector:
    matchLabels:
      app: openmanus
  template:
    metadata:
      labels:
        app: openmanus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: git-clone-openmanus
        image: registry.invalid/openclaw-reviewed/git:operator-must-pin
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        env:
        - {name: HOME, value: /tmp}
        - name: OPENMANUS_COMMIT
          valueFrom:
            configMapKeyRef: {name: openmanus-reviewed-source, key: commit}
        - name: OPENMANUS_REPOSITORY
          valueFrom:
            configMapKeyRef: {name: openmanus-reviewed-source, key: repository}
        command: [/bin/sh, -ec]
        args:
        - |
          test "${#OPENMANUS_COMMIT}" -eq 40
          case "$OPENMANUS_COMMIT" in *[!0-9a-f]*) exit 1;; esac
          case "$OPENMANUS_REPOSITORY" in https://github.com/*/*.git) ;; *) exit 1;; esac
          git -c core.hooksPath=/dev/null init --template= /openmanus-src
          git -C /openmanus-src remote add origin "$OPENMANUS_REPOSITORY"
          git -c credential.helper= -C /openmanus-src fetch --depth=1 origin "$OPENMANUS_COMMIT"
          git -c core.hooksPath=/dev/null -C /openmanus-src checkout --detach FETCH_HEAD
          test "$(git -C /openmanus-src rev-parse HEAD)" = "$OPENMANUS_COMMIT"
        volumeMounts:
        - name: openmanus-volume
          mountPath: /openmanus-src
        - {name: tmp, mountPath: /tmp}
      containers:
      - name: openmanus
        image: registry.invalid/openclaw-reviewed/openmanus:operator-must-pin
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        command: ["python", "/openmanus-src/main.py"] # Annahme: main.py ist der Startpunkt
        ports:
        - containerPort: 8000 # Beispiel Port
        volumeMounts:
        - name: openmanus-volume
          mountPath: /openmanus-src
          readOnly: true
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
      - name: openmanus-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openmanus-service
  namespace: ai-services
spec:
  selector:
    app: openmanus
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP # Interner Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-ollama-proxy
  namespace: ai-services
  labels:
    app: gemini-ollama-proxy
spec:
  replicas: 0
  selector:
    matchLabels:
      app: gemini-ollama-proxy
  template:
    metadata:
      labels:
        app: gemini-ollama-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: proxy
        image: registry.invalid/openclaw-reviewed/gemini-proxy:operator-must-pin
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        command: ["python", "/app/proxy.py"]
        ports:
        - containerPort: 8000
        env:
        - name: PROXY_AUTH_TOKEN
          valueFrom:
            secretKeyRef: {name: gemini-secrets, key: proxy-auth-token}
        - name: GEMINI_MODEL
          valueFrom:
            configMapKeyRef: {name: gemini-reviewed-config, key: model}
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secrets
              key: api-key
        - name: OLLAMA_URL
          value: "http://ollama:11434"
        volumeMounts:
        - name: proxy-code
          mountPath: /app
          readOnly: true
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
      - name: proxy-code
        configMap:
          name: gemini-ollama-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: gemini-ollama-proxy-service
  namespace: ai-services
spec:
  selector:
    app: gemini-ollama-proxy
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gemini-ollama-proxy-config
  namespace: ai-services
data:
  proxy.py: |
    import hmac
    import os
    import requests
    from flask import Flask, request, jsonify

    app = Flask(__name__)
    app.config["MAX_CONTENT_LENGTH"] = 65536

    GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")
    OLLAMA_URL = os.getenv("OLLAMA_URL")
    GEMINI_MODEL = os.environ["GEMINI_MODEL"]
    PROXY_AUTH_TOKEN = os.environ["PROXY_AUTH_TOKEN"]
    if len(PROXY_AUTH_TOKEN) < 32 or not GEMINI_API_KEY:
        raise RuntimeError("Proxy requires separately provisioned credentials")

    @app.before_request
    def authorize():
        supplied = request.headers.get("Authorization", "")
        expected = "Bearer " + PROXY_AUTH_TOKEN
        if not hmac.compare_digest(supplied.encode("utf-8"), expected.encode("utf-8")):
            return jsonify({"error": "Unauthorized"}), 401

    @app.route("/generate", methods=["POST"])
    def generate():
        body = request.get_json(silent=True)
        prompt = body.get("prompt") if isinstance(body, dict) else None
        if not isinstance(prompt, str) or not prompt.strip() or len(prompt) > 16000:
            return jsonify({"error": "No prompt provided"}), 400

        try:
            # Versuch, Gemini zu nutzen
            gemini_headers = {"Content-Type": "application/json", "x-goog-api-key": GEMINI_API_KEY}
            gemini_payload = {"contents": [{"parts": [{"text": prompt}]}]}
            gemini_response = requests.post(
                f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_MODEL}:generateContent",
                headers=gemini_headers,
                json=gemini_payload,
                timeout=10
            )
            gemini_response.raise_for_status()
            gemini_data = gemini_response.json()
            if gemini_data and "candidates" in gemini_data and gemini_data["candidates"]:
                return jsonify({"text": gemini_data["candidates"][0]["content"]["parts"][0]["text"]})

        except (requests.exceptions.RequestException, KeyError, ValueError, IndexError, TypeError):
            app.logger.warning("Gemini request failed; no request or credential details logged")
            # Fallback auf Ollama
            if OLLAMA_URL:
                try:
                    ollama_payload = {"model": "llama3.2:1b", "prompt": prompt, "stream": False}
                    ollama_response = requests.post(f"{OLLAMA_URL}/api/generate", json=ollama_payload, timeout=30)
                    ollama_response.raise_for_status()
                    ollama_data = ollama_response.json()
                    return jsonify({"text": ollama_data["response"]})
                except (requests.exceptions.RequestException, ValueError, KeyError):
                    app.logger.warning("Ollama request failed; no request details logged")
                    return jsonify({"error": "Beide LLM-Anbieter sind nicht erreichbar."}), 500
            else:
                return jsonify({"error": "Gemini fehlgeschlagen und Ollama-URL nicht konfiguriert."}), 500

        return jsonify({"error": "Unbekannter Fehler bei der LLM-Generierung."}), 500

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8000)
